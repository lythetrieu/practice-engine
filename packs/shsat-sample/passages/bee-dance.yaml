id: bee-dance
title: How Honeybees Give Directions
genre: informational
paragraphs:
  - "A honeybee that finds a good patch of flowers does not keep the news to herself. Back at the hive, she tells her sisters where to go. She does it with a dance."
  - "The dance takes place on the upright wall of the honeycomb, inside the dark hive. The bee walks forward in a straight line while she shakes her body from side to side. This part is called the waggle run. Then she circles back to the start and repeats it."
  - "The waggle run holds the message. Its angle shows which way the flowers lie compared to the sun. A bee that waggles straight up is pointing toward the sun. If her run leans to the left of straight up, the flowers lie to the left of the sun. How long the bee waggles matters too. A longer waggle run means the flowers are farther away."
  - "The other bees crowd around the dancer. They touch her with their antennae, and they pick up the smell of the flowers on her body. Then they fly out to look for the place she has described. Scientists have checked this by putting food in a certain spot and watching where the bees go. The bees go to the spot the dance points to."
  - "This system helps the whole colony. A hive can hold many thousands of bees. When one scout finds a rich patch of flowers, her dance sends more workers there quickly. Later, when the flowers have little nectar left, fewer bees dance about them, and fewer bees fly there. In this way, the colony can keep up with the best food nearby without any bee being in charge."
source: Written for this pack.
