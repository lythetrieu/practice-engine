id: kite-day
title: The Kite Tail
genre: literary
paragraphs:
  - "By noon, the field behind the school was full of kites. There were red ones and yellow ones, and a long green dragon that rippled like a river. Tomas stood at the edge of the grass holding his own kite, a plain white diamond. He had worked on it all week. He had measured every stick twice."
  - "He ran across the field and let go of the string. The kite rose as high as his head, wobbled, and spun nose first into the ground. He tried again. It spun again. The third time, the kite snagged on a low branch of the oak tree and hung there like a sheet on a clothesline."
  - "Tomas sat down hard and stared at his shoes. \"It's a bad kite,\" he said to no one. \"I should have bought one at the store.\""
  - "His neighbor Lupe, who was nine and never seemed to worry about anything, climbed the tree and freed the kite. She turned it over in her hands. \"It isn't bad,\" she said. \"It's just missing something.\""
  - "\"Like what?\" asked Tomas. \"A tail. A kite needs a tail to keep its nose up.\" Tomas thought of the blue scarf stuffed in his backpack. He had planned to wear it home. Instead, he tore it into long strips, and Lupe helped him knot the strips end to end and tie them to the bottom of the kite."
  - "\"Now try,\" said Lupe. This time Tomas did not run. He just lifted the kite, and the wind took it. It climbed past the oak and past the school roof until it was a small white diamond with a blue ribbon trailing behind. Tomas held the string with both hands. He did not look at his shoes once."
source: Written for this pack.
