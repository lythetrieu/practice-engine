id: honeybee-dance
title: How Honeybees Share Directions
genre: informational
paragraphs:
  - When a honeybee finds a patch of flowers full of nectar, it faces a problem. The flowers may be a kilometer or more from the hive, and the other bees cannot see them. The bee solves this problem by dancing.
  - Back inside the dark hive, the scout bee climbs onto the upright honeycomb and walks a short, straight line while shaking her body from side to side. Then she circles back and repeats the pattern. Scientists call this the waggle dance. On the comb, straight up stands for the direction of the sun. If the bee waggles straight up, the flowers lie toward the sun. If her line tilts to the right of straight up, the flowers lie to the right of the sun.
  - The length of the waggle tells how far to fly. A longer waggle means the flowers are farther away. Other bees crowd around the dancer, touch her with their antennae, and pick up the message. Then they fly out and find the flowers on their own.
  - Researchers needed many years of careful watching before they understood the dance. Their work showed that an insect with a tiny brain can still pass along detailed information to its hivemates.
source: Written for this pack.
